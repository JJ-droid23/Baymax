<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accanto – demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      flex-wrap: wrap;
      padding: 30px;
      background: radial-gradient(ellipse at top, #22303a, #14171c 60%);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* ---------- telefono ---------- */
    .colonna { display: flex; flex-direction: column; align-items: center; }
    .etichetta {
      color: #94a3b8; font-size: 14px; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 14px;
    }
    .telefono {
      width: 340px; height: 700px;
      background: #0b0b0d; border-radius: 50px; padding: 12px;
      box-shadow: 0 0 0 2px #2a2d33, 0 30px 80px rgba(0,0,0,.5);
    }
    .schermo {
      position: relative; width: 100%; height: 100%;
      border-radius: 40px; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .barra-stato {
      display: flex; justify-content: space-between;
      padding: 16px 28px 8px; font-size: 13px; font-weight: 600;
    }

    /* ---------- telefono dell'anziana ---------- */
    .anziana { background: #fbf7ef; color: #1c1917; }
    .orologio { text-align: center; font-size: 80px; font-weight: 800; margin-top: 20px; }
    .data { text-align: center; font-size: 22px; font-weight: 600; margin-bottom: 20px; }
    .scheda {
      background: #fff; border-radius: 20px; margin: 0 16px; padding: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }
    .promemoria-titolo { font-size: 22px; font-weight: 800; }
    .promemoria-testo { font-size: 18px; color: #44403c; margin: 4px 0 14px; }
    .bottone-ok {
      width: 100%; border: 0; border-radius: 16px; padding: 14px;
      background: #16a34a; color: #fff; font-size: 20px; font-weight: 700;
    }
    .bottone-sos {
      margin: auto 16px 26px; height: 110px; border: 0; border-radius: 28px;
      background: #dc2626; color: #fff; font-size: 48px; font-weight: 900;
      letter-spacing: 4px; box-shadow: 0 8px 0 #991b1b; cursor: pointer;
    }

    /* ---------- app del familiare ---------- */
    .familiare { background: #f5f7f8; color: #0f172a; }
    .intestazione { padding: 6px 22px 14px; }
    .logo { font-size: 28px; font-weight: 800; color: #0f766e; }
    .saluto { color: #64748b; font-size: 15px; }
    .persona { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      background: #ccfbf1; color: #0f766e;
      display: grid; place-items: center; font-weight: 800; font-size: 20px;
    }
    .nome { font-weight: 700; font-size: 17px; }
    .dettaglio { color: #64748b; font-size: 13px; }
    .stato {
      margin-left: auto; padding: 6px 10px; border-radius: 999px;
      background: #dcfce7; color: #166534; font-size: 12px; font-weight: 800;
    }
    .titolo-sezione {
      margin: 20px 22px 8px; font-size: 13px; font-weight: 800;
      color: #64748b; text-transform: uppercase; letter-spacing: 1px;
    }
    .evento {
      display: flex; gap: 10px; align-items: center;
      background: #fff; border-radius: 14px; margin: 0 16px 8px; padding: 10px 12px;
    }
    .evento-icona { font-size: 22px; }
    .evento-titolo { font-weight: 700; font-size: 14px; }
  </style>
</head>
<body>

  <!-- TELEFONO DELL'ANZIANA -->
  <div class="colonna">
    <div class="etichetta">Telefono di Anna</div>
    <div class="telefono">
      <div class="schermo anziana">
        <div class="barra-stato"><span class="ora-piccola"></span><span>●●● ▮</span></div>
        <div class="orologio" id="orologio">--:--</div>
        <div class="data" id="data"></div>

        <div class="scheda">
          <div class="promemoria-titolo">💊 Ore 15:00</div>
          <div class="promemoria-testo">Cardioaspirina · 1 compressa</div>
          <button class="bottone-ok" id="bottone-preso">✓ L'ho presa</button>
        </div>

        <button class="bottone-sos" id="bottone-sos">SOS</button>
      </div>
    </div>
  </div>

  <!-- APP DEL FAMILIARE -->
  <div class="colonna">
    <div class="etichetta">App di Marco (figlio)</div>
    <div class="telefono">
      <div class="schermo familiare">
        <div class="barra-stato"><span class="ora-piccola"></span><span>●●● ▮</span></div>
        <div class="intestazione">
          <div class="logo">◉ Accanto</div>
          <div class="saluto">Ciao Marco</div>
        </div>

        <div class="scheda persona">
          <div class="avatar">A</div>
          <div>
            <div class="nome">Anna</div>
            <div class="dettaglio">Casa · sensori attivi</div>
          </div>
          <div class="stato" id="stato">Tutto ok</div>
        </div>

        <div class="titolo-sezione">Oggi</div>
        <div id="storico">
          <div class="evento">
            <span class="evento-icona">🟢</span>
            <div>
              <div class="evento-titolo">Sensori attivi</div>
              <div class="dettaglio">Fotocamera e microfono pronti</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Orologio e data che si aggiornano da soli
    function aggiornaOra() {
      const adesso = new Date();
      const ora = adesso.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      let data = adesso.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      data = data.charAt(0).toUpperCase() + data.slice(1);
      document.getElementById('orologio').textContent = ora;
      document.getElementById('data').textContent = data;
      document.querySelectorAll('.ora-piccola').forEach(el => el.textContent = ora);
    }
    aggiornaOra();
    setInterval(aggiornaOra, 1000);
  </script>
</body>
</html>
